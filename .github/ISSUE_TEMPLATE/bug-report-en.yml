name: Bug report (English)
description: Report a reproducible problem in the interface, data display, or build
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the current behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the URL state, selected meteorite, language, filters, and viewport when relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 126 / Windows 11 / 390x844
    validations:
      required: true
